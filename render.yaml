# Render Blueprint — static SPA (Vite) + React Router
# If you already created the site in the dashboard, either:
#   • Link this repo as a Blueprint (sync), or
#   • Add the same rewrite manually: Static Site → Redirects/Rewrites (see comment below)

services:
  - type: web
    name: ratai24-ui
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # So /login, /dashboard, etc. serve index.html on refresh (client router handles path)
      - type: rewrite
        source: /*
        destination: /index.html
